<section class="px-12 py-16 min-h-screen" style="background:#f8f7ff">
  <div class="max-w-xl mx-auto">
    <div class="text-center mb-10">
      <div class="inline-block bg-purple-100 text-purple-600 px-4 py-1 rounded-full text-sm font-semibold mb-4">Contact Us</div>
      <h1 class="font-black text-5xl text-gray-900 mb-4" style="font-family:'Syne',sans-serif">Get In Touch</h1>
      <p class="text-gray-500 text-base">Have a question? We'd love to hear from you.</p>
    </div>
    <div class="bg-white rounded-2xl p-8 shadow-sm">
      <div class="mb-5">
        <label class="block text-sm font-semibold text-gray-700 mb-2">Full Name</label>
        <input type="text" placeholder="Your name" class="w-full p-3 rounded-xl border-2 border-gray-200 outline-none focus:border-purple-600 text-gray-700"/>
      </div>
      <div class="mb-5">
        <label class="block text-sm font-semibold text-gray-700 mb-2">Email</label>
        <input type="email" placeholder="your@email.com" class="w-full p-3 rounded-xl border-2 border-gray-200 outline-none focus:border-purple-600 text-gray-700"/>
      </div>
      <div class="mb-6">
        <label class="block text-sm font-semibold text-gray-700 mb-2">Message</label>
        <textarea rows="4" placeholder="Your message..." class="w-full p-3 rounded-xl border-2 border-gray-200 outline-none focus:border-purple-600 text-gray-700 resize-none"></textarea>
      </div>
      <button class="w-full py-3 bg-purple-600 text-white rounded-xl font-bold text-sm hover:bg-purple-700 transition-all">
        Send Message
      </button>
    </div>
  </div>
</section>
