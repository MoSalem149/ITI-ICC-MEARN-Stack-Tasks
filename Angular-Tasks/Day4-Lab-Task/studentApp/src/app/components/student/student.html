<section class="px-12 py-16 bg-white">
  <div class="text-center mb-12">
    <div class="inline-block bg-purple-100 text-purple-600 px-4 py-1 rounded-full text-sm font-semibold mb-3">Our Team</div>
    <h2 class="font-black text-4xl text-gray-900 mb-3" style="font-family:'Syne',sans-serif">Meet the Instructors</h2>
    <p class="text-gray-500 text-base">Learn from the best in their fields</p>
  </div>

  <div class="flex gap-6 justify-center flex-wrap">

    <div class="bg-white rounded-2xl p-8 text-center w-56 transition-all duration-300 hover:-translate-y-1"
         style="box-shadow:0 4px 24px rgba(0,0,0,0.06);border:2px solid transparent"
         onmouseover="this.style.borderColor='#6c47ff';this.style.boxShadow='0 12px 32px rgba(108,71,255,0.15)'"
         onmouseout="this.style.borderColor='transparent';this.style.boxShadow='0 4px 24px rgba(0,0,0,0.06)'">
      <img [src]="students[0].photoUrl" [alt]="students[0].name"
           class="w-20 h-20 rounded-full mx-auto mb-4 object-cover"
           style="border:3px solid #ede9ff" />
      <div class="font-bold text-gray-900 text-base mb-2" style="font-family:'Syne',sans-serif">{{ students[0].name }}</div>
      <div class="inline-block bg-gray-100 text-gray-500 text-xs px-3 py-1 rounded-full">Age {{ students[0].age }}</div>
    </div>

    <div class="bg-white rounded-2xl p-8 text-center w-56 transition-all duration-300 hover:-translate-y-1"
         style="box-shadow:0 4px 24px rgba(0,0,0,0.06);border:2px solid transparent"
         onmouseover="this.style.borderColor='#6c47ff';this.style.boxShadow='0 12px 32px rgba(108,71,255,0.15)'"
         onmouseout="this.style.borderColor='transparent';this.style.boxShadow='0 4px 24px rgba(0,0,0,0.06)'">
      <img [src]="students[1].photoUrl" [alt]="students[1].name"
           class="w-20 h-20 rounded-full mx-auto mb-4 object-cover"
           style="border:3px solid #ede9ff" />
      <div class="font-bold text-gray-900 text-base mb-2" style="font-family:'Syne',sans-serif">{{ students[1].name }}</div>
      <div class="inline-block bg-gray-100 text-gray-500 text-xs px-3 py-1 rounded-full">Age {{ students[1].age }}</div>
    </div>

    <div class="bg-white rounded-2xl p-8 text-center w-56 transition-all duration-300 hover:-translate-y-1"
         style="box-shadow:0 4px 24px rgba(0,0,0,0.06);border:2px solid transparent"
         onmouseover="this.style.borderColor='#6c47ff';this.style.boxShadow='0 12px 32px rgba(108,71,255,0.15)'"
         onmouseout="this.style.borderColor='transparent';this.style.boxShadow='0 4px 24px rgba(0,0,0,0.06)'">
      <img [src]="students[2].photoUrl" [alt]="students[2].name"
           class="w-20 h-20 rounded-full mx-auto mb-4 object-cover"
           style="border:3px solid #ede9ff" />
      <div class="font-bold text-gray-900 text-base mb-2" style="font-family:'Syne',sans-serif">{{ students[2].name }}</div>
      <div class="inline-block bg-gray-100 text-gray-500 text-xs px-3 py-1 rounded-full">Age {{ students[2].age }}</div>
    </div>

  </div>
</section>
