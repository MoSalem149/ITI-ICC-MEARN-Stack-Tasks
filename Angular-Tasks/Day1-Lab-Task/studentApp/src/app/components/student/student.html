<div class="min-h-screen bg-gray-100 p-8">

  <h1 class="text-3xl font-bold text-center text-gray-800 mb-8">Students</h1>

  <div class="flex flex-row gap-6 justify-center">

    <div class="bg-white rounded-2xl shadow-lg p-6 w-64 text-center">
      <img [src]="students[0].photoUrl" [alt]="students[0].name"
           class="w-24 h-24 rounded-full mx-auto mb-4" />
      <p class="text-xl font-bold text-gray-800">{{ students[0].name }}</p>
      <p class="text-gray-500">Age: {{ students[0].age }}</p>
    </div>

    <div class="bg-white rounded-2xl shadow-lg p-6 w-64 text-center">
      <img [src]="students[1].photoUrl" [alt]="students[1].name"
           class="w-24 h-24 rounded-full mx-auto mb-4" />
      <p class="text-xl font-bold text-gray-800">{{ students[1].name }}</p>
      <p class="text-gray-500">Age: {{ students[1].age }}</p>
    </div>

    <div class="bg-white rounded-2xl shadow-lg p-6 w-64 text-center">
      <img [src]="students[2].photoUrl" [alt]="students[2].name"
           class="w-24 h-24 rounded-full mx-auto mb-4" />
      <p class="text-xl font-bold text-gray-800">{{ students[2].name }}</p>
      <p class="text-gray-500">Age: {{ students[2].age }}</p>
    </div>

  </div>
</div>
