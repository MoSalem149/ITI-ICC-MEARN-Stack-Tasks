<section class="px-12 py-10 bg-white border-t border-gray-100">

  <!-- HEADER -->
  <div class="flex justify-between items-center mb-8">
    <h2 class="font-black text-3xl text-gray-900" style="font-family:'Syne',sans-serif">
      Place Your Order
    </h2>
    <div class="flex items-center gap-4">

      <!-- ORDER STATUS -->
      @if (currentStatus) {
        <div class="flex items-center gap-2 px-4 py-2 rounded-xl text-sm font-semibold transition-all"
             [class]="currentStatus.color">
          {{ currentStatus.label }}
          @if (!statusComplete) {
            <div class="w-3 h-3 rounded-full border-2 border-current border-t-transparent animate-spin ml-1"></div>
          }
        </div>
      }

      <!-- TOTAL PRICE -->
      <div class="bg-purple-600 text-white px-6 py-3 rounded-2xl">
        <span class="text-sm font-medium">Total:</span>
        <span class="font-black text-xl ml-2">{{ totalPrice | currency:'USD' }}</span>
      </div>
    </div>
  </div>

  <!-- TRACK ORDER BUTTON -->
  @if (totalPrice > 0) {
    <div class="mb-6">
      <button
        (click)="trackOrder()"
        class="px-6 py-2.5 bg-purple-600 text-white rounded-xl font-bold text-sm hover:bg-purple-700 transition-all">
        🚀 Track Order Status
      </button>
      @if (statusComplete) {
        <span class="ml-3 text-green-600 font-semibold text-sm">✅ Enrollment Complete!</span>
      }
    </div>
  }

  <!-- CATEGORY FILTER -->
  <div class="mb-8">
    <label class="text-sm font-semibold text-gray-600 mb-2 block">Filter by Category</label>
    <select
      [(ngModel)]="selectedCatId"
      class="p-3 rounded-xl border-2 border-gray-200 text-gray-700 font-medium w-64 outline-none"
      style="transition:border-color 0.2s"
      onfocus="this.style.borderColor='#6c47ff'"
      onblur="this.style.borderColor='#e5e7eb'">
      <option [ngValue]="0">All Categories</option>
      @for (cat of categories(); track cat.id) {
        <option [ngValue]="cat.id">{{ cat.name }}</option>
      }
    </select>
  </div>

  <!-- CHILD COMPONENT -->
  <app-courses
    [sentCatId]="selectedCatId"
    (onTotalPriceChanged)="setTotalPrice($event)">
  </app-courses>

</section>
