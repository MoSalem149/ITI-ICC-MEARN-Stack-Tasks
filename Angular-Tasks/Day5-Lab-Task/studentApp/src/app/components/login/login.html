<section class="min-h-screen flex items-center justify-center" style="background:#f8f7ff">
  <div class="bg-white rounded-2xl shadow-lg p-10 w-full max-w-md">

    <div class="text-center mb-8">
      <div class="font-black text-3xl mb-2" style="font-family:'Syne',sans-serif;color:#6c47ff">
        Learn<span style="color:#ff6b35">ly</span>
      </div>
      <h2 class="font-black text-2xl text-gray-900 mb-1" style="font-family:'Syne',sans-serif">Welcome Back!</h2>
      <p class="text-gray-500 text-sm">Sign in to access your courses</p>
    </div>

    @if (errorMessage) {
      <div class="bg-red-50 border border-red-200 text-red-600 text-sm px-4 py-3 rounded-xl mb-5">
        {{ errorMessage }}
      </div>
    }

    <div class="mb-5">
      <label class="block text-sm font-semibold text-gray-700 mb-2">Username</label>
      <input
        type="text"
        [(ngModel)]="username"
        placeholder="Enter your username"
        class="w-full p-3 rounded-xl border-2 border-gray-200 outline-none text-gray-700 text-sm"
        style="transition: border-color 0.2s"
        onfocus="this.style.borderColor='#6c47ff'"
        onblur="this.style.borderColor='#e5e7eb'"/>
    </div>

    <div class="mb-6">
      <label class="block text-sm font-semibold text-gray-700 mb-2">Password</label>
      <input
        type="password"
        [(ngModel)]="password"
        placeholder="Enter your password"
        class="w-full p-3 rounded-xl border-2 border-gray-200 outline-none text-gray-700 text-sm"
        style="transition: border-color 0.2s"
        onfocus="this.style.borderColor='#6c47ff'"
        onblur="this.style.borderColor='#e5e7eb'"/>
    </div>

    <button
      (click)="login()"
      class="w-full py-3 bg-purple-600 text-white rounded-xl font-bold text-sm hover:bg-purple-700 transition-all">
      Sign In
    </button>

    <p class="text-center text-gray-400 text-xs mt-4">
      Use any username and password to login
    </p>
  </div>
</section>
