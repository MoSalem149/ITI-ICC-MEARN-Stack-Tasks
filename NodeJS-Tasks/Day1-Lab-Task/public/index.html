<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Curator — Bookmark Manager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=Figtree:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <header>
      <div class="header-left">
        <svg class="header-logo" width="24" height="24" viewBox="0 0 32 32" fill="none">
          <rect x="2" y="4" width="20" height="26" rx="2" stroke="currentColor" stroke-width="2"/>
          <rect x="10" y="2" width="20" height="26" rx="2" fill="currentColor" opacity="0.15" stroke="currentColor" stroke-width="2"/>
          <line x1="14" y1="10" x2="26" y2="10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <line x1="14" y1="15" x2="24" y2="15" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <line x1="14" y1="20" x2="22" y2="20" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <h1>Curator</h1>
      </div>
    </header>

    <nav class="sidebar">
      <div class="sidebar-section">
        <h3 class="sidebar-label">Collections</h3>
        <ul id="collection-list"></ul>
      </div>
      <div class="sidebar-footer">
        <button id="new-collection-btn" class="btn-new-collection">
          <span class="plus-icon">+</span> New collection
        </button>
        <div id="new-collection-form" class="hidden">
          <input type="text" id="collection-name" placeholder="Collection name..." />
          <button id="save-collection-btn" class="btn-small">Create</button>
        </div>
      </div>
    </nav>

    <main>
      <!-- Add Bookmark Form -->
      <form id="bookmark-form" class="add-form">
        <input type="url" name="url" placeholder="https://..." required />
        <input type="text" name="title" placeholder="Title" required />
        <input type="text" name="tags" placeholder="Tags (comma separated)" />
        <button type="submit">
          <span class="btn-label">Add</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </button>
      </form>

      <!-- Bookmarks List -->
      <ul id="bookmark-list"></ul>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
